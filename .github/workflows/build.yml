name: build-and-test

on:
  push:
    branches: [main, dev/**]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0.5"

      - name: Configure
        run: cmake -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release

      - name: Enable MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Standalone tests
        run: powershell -ExecutionPolicy Bypass -File tests/run_tests.ps1
